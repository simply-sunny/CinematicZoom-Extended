name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the [troubleshooting table](https://github.com/simply-sunny/CinematicZoom-Extended#troubleshooting) first.
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "1.21.11"
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Cinematic Zoom Extended version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Loader and version
      placeholder: "Fabric Loader 0.18.4"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Hold the zoom key
        2. ...
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Especially other zoom, camera, HUD or rendering mods (Sodium, Iris, shaders).
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: Attach `logs/latest.log` or the crash report, or paste a link.
